name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release

    steps:
      - name: Require main branch
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Run deterministic fast gates
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium extension integration tests
        run: npm run test:e2e

      - name: Generate deterministic release package
        run: npm run release:package

      - name: Verify packaged extension in Chromium
        run: npm run release:verify

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: echo-extension-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
