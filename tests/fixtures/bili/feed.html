<!doctype html>
<html>
  <head><title>Bilibili fixture</title></head>
  <body>
    <section class="feed2">
      <div class="feed-roll-btn">
        <button class="primary-btn roll-btn" type="button">换一换</button>
      </div>
      <div class="recommended-container_floor-aside">
        <div class="feed-card">
          <article class="bili-video-card video-card-a">
            <div class="bili-video-card__wrap">
              <a class="bili-video-card__image--link" href="https://www.bilibili.com/video/BV1fixtureA">
                <picture><img src="https://i.example/a.webp" alt="Fixture A"></picture>
              </a>
              <div class="bili-video-card__stats">
                <div class="bili-video-card__stats--left">
                  <span class="bili-video-card__stats--item"><span class="bili-video-card__stats--text">1万</span></span>
                  <span class="bili-video-card__stats--item"><span class="bili-video-card__stats--text">200</span></span>
                </div>
                <span class="bili-video-card__stats__duration">03:21</span>
              </div>
              <div class="bili-video-card__info">
                <h3 class="bili-video-card__info--tit" title="Fixture A"><a href="https://www.bilibili.com/video/BV1fixtureA">Fixture A</a></h3>
                <div class="bili-video-card__info--bottom">
                  <a class="bili-video-card__info--owner" href="https://space.bilibili.com/100">
                    <span class="bili-video-card__info--owner__up"></span>
                    <span class="bili-video-card__info--author">Author A</span>
                  </a>
                  <span class="bili-video-card__info--date">昨天</span>
                </div>
              </div>
            </div>
          </article>
        </div>
        <div class="feed-card">
          <article class="bili-video-card video-card-ad">
            <div class="bili-video-card__wrap">
              <a class="bili-video-card__image--link" href="https://www.bilibili.com/video/BV1fixtureAd">
                <picture><img src="https://i.example/ad.webp" alt="Fixture Ad"></picture>
              </a>
              <div class="bili-video-card__stats">
                <span class="bili-video-card__stats--text">广告</span>
              </div>
              <div class="bili-video-card__info">
                <h3 class="bili-video-card__info--tit" title="Fixture Ad"><a href="https://www.bilibili.com/video/BV1fixtureAd">Fixture Ad</a></h3>
                <div class="bili-video-card__info--bottom">
                  <a class="bili-video-card__info--owner disable-hover" href="https://space.bilibili.com/200">
                    <span class="bili-video-card__info--author">Advertiser</span>
                  </a>
                </div>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </body>
</html>
